# The slides of the default walk. talk.md holds seven slides, separated by lines that are exactly ---
[slides]
step-00 = ["talk.md#1"]
step-01 = ["talk.md#2", "counting.svg"]   # a slide, then a picture
step-02 = ["talk.md#3-4"]
step-04 = ["talk.md#6"]
step-05 = ["talk.md#7"]

# A step under [docs] shows one whole Markdown file instead of slides. It scrolls.
[docs]
step-03 = "formatting.md"
