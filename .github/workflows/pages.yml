# The website of the pages that students read: on a push to main that changes pages/, smalldocs builds each
# pages/ID/site, and GitHub Pages publishes them at /timewalk-test/ID/, with a front page that lists the walks.
# `just site` builds the same website locally. In the repository's settings on GitHub, under Pages, set the source to
# GitHub Actions once.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "toc.toml"
      - "pages_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write  # to publish the site
  id-token: write  # to prove to Pages that this workflow is the one publishing

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: python3 pages_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
