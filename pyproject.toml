[project]
name = "timewalk-test"
version = "0.1.0"
description = "The integration test of timewalk: a class folder, a project history built from history/, and tests that drive the page"
requires-python = ">=3.11"
dependencies = ["timewalk"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[tool.uv]
package = false

[tool.uv.sources]
# The branch under test: main, which students use. For work in progress, point this at its branch.
timewalk = { git = "https://github.com/rahuldave/timewalk", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that waits on the page fails after two minutes, with a traceback, and never hangs the run.
timeout = 120
markers = [
    "pages: the pages of every walk, rendered by walk-kit and followed in a clone (just test -k pages)",
    "github: the pages of tally-walk on GitHub, followed by walk-kit's just test-github (TIMEWALK_TEST_GITHUB=1)",
]
